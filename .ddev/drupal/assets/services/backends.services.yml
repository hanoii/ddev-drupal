# #ddev-generated
# Cache backends provided by hanoii/ddev-drupal. Always loaded, so they can be
# used in any bin regardless of the configured preset.
services:
  cache.backend.null:
    class: Drupal\Core\Cache\NullBackendFactory
  # Stores cache entries in the database but always returns a miss. Useful for
  # debugging cache contexts and tags without having to rebuild the cache.
  cache.backend.database.null:
    class: Ddev\Drupal\Cache\DatabaseNullBackendFactory
    arguments: ['@database', '@cache_tags.invalidator.checksum', '@settings', '@serialization.phpserialize', '@datetime.time']
